name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and never-do rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3
      - run: python -m pytest -q
